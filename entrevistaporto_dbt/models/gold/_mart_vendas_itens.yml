version: 2

models:
  - name: mart_vendas_itens
    description: "Mart analítico de vendas no grão de item do pedido."

    columns:
      - name: id_item
        description: "Identificador único do item."
        data_tests:
          - not_null
          - unique

      - name: id_pedido
        description: "Identificador do pedido."
        data_tests:
          - not_null

      - name: data_pedido
        description: "Data do pedido."
        data_tests:
          - not_null

      - name: id_produto
        description: "Identificador do produto."
        data_tests:
          - not_null

      - name: id_cliente
        description: "Identificador do cliente."
        data_tests:
          - not_null

      - name: id_vendedor
        description: "Identificador do vendedor."
        data_tests:
          - not_null

      - name: quantidade
        description: "Quantidade de unidades do item."
        data_tests:
          - not_null

      - name: preco_unitario
        description: "Preço unitário."
        data_tests:
          - not_null

      - name: desconto
        description: "Percentual de desconto."
        data_tests:
          - not_null

      - name: valor_bruto
        description: "Valor bruto do item."
        data_tests:
          - not_null

      - name: valor_desconto
        description: "Valor monetário do desconto."
        data_tests:
          - not_null

      - name: valor_liquido
        description: "Valor líquido do item."
        data_tests:
          - not_null