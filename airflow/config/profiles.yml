entrevistaporto_dbt:
  outputs:
    dev:
      dataset: entrevistaporto_staging
      job_execution_timeout_seconds: 300
      job_retries: 1
      keyfile: /opt/airflow/keys/gcp.json
      location: US-EAST1
      method: service-account
      priority: interactive
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      threads: 4
      type: bigquery
  target: dev
