services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/gcp.json
    volumes:
      - ./dags:/opt/airflow/dags
      - ../src:/opt/airflow/project/src
      - ../entrevistaporto_dbt:/opt/airflow/project/entrevistaporto_dbt
      - ../.env:/opt/airflow/project/.env:ro
      - ./config/profiles.yml:/opt/airflow/project/config/profiles.yml:ro
      - ../keys/gcp.json:/opt/airflow/keys/gcp.json:ro
    command:
      - bash
      - -c
      - |
        airflow db migrate

  airflow-apiserver:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/gcp.json
    volumes:
      - ./dags:/opt/airflow/dags
      - ../src:/opt/airflow/project/src
      - ../entrevistaporto_dbt:/opt/airflow/project/entrevistaporto_dbt
      - ../.env:/opt/airflow/project/.env:ro
      - ./config/profiles.yml:/opt/airflow/project/config/profiles.yml:ro
      - ../keys/gcp.json:/opt/airflow/keys/gcp.json:ro
    command: api-server

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/gcp.json
    volumes:
      - ./dags:/opt/airflow/dags
      - ../src:/opt/airflow/project/src
      - ../entrevistaporto_dbt:/opt/airflow/project/entrevistaporto_dbt
      - ../.env:/opt/airflow/project/.env:ro
      - ./config/profiles.yml:/opt/airflow/project/config/profiles.yml:ro
      - ../keys/gcp.json:/opt/airflow/keys/gcp.json:ro
    command: scheduler

  airflow-dag-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/gcp.json
    volumes:
      - ./dags:/opt/airflow/dags
      - ../src:/opt/airflow/project/src
      - ../entrevistaporto_dbt:/opt/airflow/project/entrevistaporto_dbt
      - ../.env:/opt/airflow/project/.env:ro
      - ./config/profiles.yml:/opt/airflow/project/config/profiles.yml:ro
      - ../keys/gcp.json:/opt/airflow/keys/gcp.json:ro
    command: dag-processor

volumes:
  postgres_data: