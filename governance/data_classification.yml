version: 1

project:
  name: entrevistaporto
  description: "Classificação e tratamento de dados do projeto de Engenharia de Dados"

classification_levels:
  PUBLIC:
    description: "Dados que podem ser disponibilizados sem restrição relevante."

  INTERNAL:
    description: "Dados destinados ao uso interno da organização."

  CONFIDENTIAL:
    description: "Dados que exigem controle de acesso."

  PII:
    description: "Dados pessoais que podem identificar ou permitir identificar uma pessoa."

tables:

  clientes:
    columns:
      id_cliente:
        classification: INTERNAL
        treatment: none

      nome:
        classification: PII
        treatment: restricted

      email:
        classification: PII
        treatment: hash_sha256

      cidade:
        classification: INTERNAL
        treatment: none

      estado:
        classification: INTERNAL
        treatment: none

      created_at:
        classification: INTERNAL
        treatment: none

      updated_at:
        classification: INTERNAL
        treatment: none

